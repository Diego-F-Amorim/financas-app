info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3333/auth/login
  body:
    type: json
    data: |-
      {
        "email": "diego@teste.com",
        "password": "12345678"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
