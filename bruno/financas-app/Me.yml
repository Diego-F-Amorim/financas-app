info:
  name: Me
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3333/auth/me
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.memberships[0].workspace.id
        method: jsonq
      variable:
        name: workspaceId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
