info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3333/auth/register
  body:
    type: json
    data: |-
      {
        "name": "Diego",
        "email": "diego@teste.com",
        "password": "12345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
